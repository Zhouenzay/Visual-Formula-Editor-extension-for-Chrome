<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <style>
        math-field {
            border: 1px solid #000000;
            min-height: 100px;
            font-size: 24px;
            padding: 10px;
            margin-top: 5px;
            display: block;
            width: 100%;
            box-sizing: border-box;
            position: relative;
        }
        math-field::after {
            content: "Visual Editor";
            position: absolute;
            bottom: 5px;
            right: 5px;
            font-size: 18px;
            color: #666;
            font-weight: bold;
        }
        #preview {
            border: 1px solid #000000;
            padding: 10px;
            margin-top: 5px;
            min-height: 50px;
            background-color: #dadada;
        }
    </style>
</head>
<body>


<math-field id="mathField" virtual-keyboard-mode="onfocus"></math-field>

<div class="buttons">
    <button id="exportBtn">Export LaTeX</button>
<!--    <button id="copyBtn">Copy</button>-->
    <button id="clearBtn">Clear</button>
</div>


<div id="preview"></div>

<!-- 仅加载本地库 -->
<script src="libs/mathlive.min.js"></script>
<script src="popup.js"></script>

</body>
</html>
