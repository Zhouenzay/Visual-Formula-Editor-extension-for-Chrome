<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <style>
        math-field {
            min-height: 100px;
            font-size: 24px;
            padding: 10px;
            margin-top: 5px;
            display: block;
            width: 100%;
            box-sizing: border-box;
            position: relative;
        }
        math-field::after {
            content: "Visual Editor";
            position: absolute;
            bottom: 5px;
            right: 5px;
            font-size: 18px;
            color: #666;
            font-weight: bold;
        }
        #preview {
            padding: 10px;
            margin-top: 5px;
            min-height: 50px;
            background-color: #dadada;
        }
        #crab {
            font-size: 14px;
            font-family: monospace;
            text-align: center;
            margin-top: 10px;
            position: relative;
            line-height: 1.2;
        }
        #crabCopy {
            font-size: 14px;
            font-family: monospace;
            text-align: center;
            margin-top: 10px;
            position: relative;
            line-height: 1.2;
        }
    </style>
</head>
<body>


<math-field id="mathField" virtual-keyboard-mode="onfocus"></math-field>

<div class="buttons">
    <button id="exportBtn">Export LaTeX</button>
<!--    <button id="copyBtn">Copy</button>-->
    <button id="clearBtn">Clear</button>
</div>


<div id="preview"></div>


<pre id="crab">
    (\(\
        ( •ᴗ•)  ↑
        o_(")(")
</pre>

<pre id="crabCopy" style="display: none;">
    (\(\
        ( •ᴗ•)  👍
        o_(")(")
</pre>


<!-- 仅加载本地库 -->
<script src="libs/mathlive.min.js"></script>
<script src="popup.js"></script>

</body>
</html>
